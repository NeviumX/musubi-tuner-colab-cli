# Qwen-Image の LoRA 学習。キーは Musubi Tuner の qwen_image_train_network.py の引数名で、このまま --config_file として読める。
# ファイル名だけの値は VM の models フォルダーを指す。config/models.txt にあれば自動でダウンロードする。
# dataset_config と sample_prompts を省略すると、config/datasets/templates と config/prompts/templates の同じ名前のファイルを使う。
# これは原本なので書き換えない。変えたいキーだけを config/training/qwen_image.local.toml に書く。値を "" にするとキーを消せる。
# 生成確認を止めるときは local に sample_every_n_epochs = 0 と書く。
# 既定は L4 の 22GB に収まるよう、fp8 とブロックのスワップを使う。A100 や H100 なら local に blocks_to_swap = 0 と書くと速くなる。

[model]
dit = "qwen_image_bf16.safetensors"
vae = "qwen_image_vae.safetensors"
text_encoder = "qwen_2.5_vl_7b.safetensors"
model_version = "original"

[job]
output_name = "my-qwen-image-lora"

[network]
network_module = "networks.lora_qwen_image"
network_dim = 16

[optimizer]
optimizer_type = "adamw8bit"
learning_rate = 5e-5

[flow_matching]
timestep_sampling = "shift"
weighting_scheme = "none"
discrete_flow_shift = 2.2

[precision_memory]
mixed_precision = "bf16"
sdpa = true
gradient_checkpointing = true
fp8_base = true
fp8_scaled = true
blocks_to_swap = 20
max_data_loader_n_workers = 2
persistent_data_loader_workers = true

[run]
max_train_epochs = 10
seed = 42

[saving]
save_every_n_epochs = 1
save_state = true
save_last_n_epochs_state = 1

[sampling]
sample_every_n_epochs = 1

# キャッシュを作るスクリプトの引数。dataset_config、vae、text_encoder、model_version は上の値を使う
[cache_latents]

[cache_text_encoder_outputs]
batch_size = 1

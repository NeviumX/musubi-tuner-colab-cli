# Z-Image の LoRA 学習。キーは Musubi Tuner の zimage_train_network.py の引数名で、このまま --config_file として読める。
# ファイル名だけの値は VM の models フォルダーを指す。config/models.txt にあれば自動でダウンロードする。
# dataset_config と sample_prompts を省略すると、config/datasets/templates と config/prompts/templates の同じ名前のファイルを使う。
# これは原本なので書き換えない。変えたいキーだけを config/training/zimage.local.toml に書く。値を "" にするとキーを消せる。
# 生成確認を止めるときは local に sample_every_n_epochs = 0 と書く。
# 既定は Z-Image のベースモデルで学習する。Turbo 向けには local に dit = "z_image_de_turbo_v1_bf16.safetensors" と書く。
# 既定は L4 の 22GB に収まるよう fp8 を使う。A100 や H100 なら local に fp8_base = false と fp8_scaled = false と書く。

[model]
dit = "z_image_bf16.safetensors"
vae = "ae.safetensors"
text_encoder = "qwen_3_4b.safetensors"

[job]
output_name = "my-zimage-lora"

[network]
network_module = "networks.lora_zimage"
network_dim = 32

[optimizer]
optimizer_type = "adamw8bit"
learning_rate = 1e-4

[flow_matching]
timestep_sampling = "shift"
weighting_scheme = "none"
discrete_flow_shift = 2.0

[precision_memory]
mixed_precision = "bf16"
sdpa = true
gradient_checkpointing = true
fp8_base = true
fp8_scaled = true
max_data_loader_n_workers = 2
persistent_data_loader_workers = true

[run]
max_train_epochs = 10
seed = 42

[saving]
save_every_n_epochs = 1
save_state = true
save_last_n_epochs_state = 1

[sampling]
sample_every_n_epochs = 1

# キャッシュを作るスクリプトの引数。dataset_config、vae、text_encoder は上の値を使う
[cache_latents]

[cache_text_encoder_outputs]
batch_size = 16
